plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

group = "net.itskittyyoutube.kitty" // 👈 IMPORTANT: change this to your real namespace
version = project.mod_version

base {
	archivesName = project.bedrocksmp_archives_base_name
}

repositories {
	// dependencies repositories (leave as-is unless needed)
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE-KittyStudios") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

//
// ✅ MAVEN PUBLISHING (THIS IS THE IMPORTANT PART YOU WERE MISSING)
//
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java

			// optional but recommended: clearer artifact naming
			artifactId = project.bedrocksmp_archives_base_name
		}
	}

	repositories {
		// 🟢 LOCAL MAVEN (THIS ENABLES modImplementation USAGE)
		mavenLocal()
	}
}